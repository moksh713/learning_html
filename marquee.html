<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- marquee tag -->
    <marquee>
        <h1>hello</h1>
    </marquee>

    <marquee direction="right" scrollamount="50" behavior="alternate" height="600px">
        <h1>hello</h1>
    </marquee>

    <marquee direction="up" behavior="alternate" height="600px">
        <h1>hello</h1>
    </marquee>

    <marquee direction="left" scrolldelay="50" behavior="alternate" height="600px">
        <h1>hello</h1>
    </marquee>
</body>
</body>
</html>
