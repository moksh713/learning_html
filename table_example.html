<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- table row example start -->
    <h1>table rowspan example</h1>
    
    <table border="2">
        <thead>
            <tr>
                <th>languages</th>
                <th>details</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4">web design</td>
                <td>HTML</td>
            </tr>
            <tr>
                <td>css</td>
            </tr>
            <tr>
                <td>bootsrap</td>
            </tr>
            <tr>
                <td>js</td>
            </tr>
        </tbody>
    </table>
    <hr>
    <table border="1">
        <thead>
            <tr>
                <th colspan="5">web design</th>
                <th colspan="5">graphic design</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> HTML</td>
                <td>CSS</td>
                <td>boot</td>
                <td>js</td>
                <td>React</td>
                <td>core</td>
                <td>figma</td>
                <td>adobe</td>
                <td>express</td>
                <td>comet</td>
            </tr>
        </tbody>

    </table>
    
</body>
</html>
